async function callAPI(system, userContent, extraHeaders = {}) {
  const key = getApiKey();
  if (!key) throw new Error("No API key set. Go to Profile → Settings → AI API Key.");
  const isArray = Array.isArray(userContent);
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-allow-browser": "true",
      ...extraHeaders
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-5",
      max_tokens: 2000,
      system,
      messages: [{
        role: "user",
        content: isArray ? userContent : [{
          type: "text",
          text: userContent
        }]
      }]
    })
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error("HTTP " + res.status + ": " + t);
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return (data.content || []).map(b => b.type === "text" ? b.text : "").join("").trim();
}
function parseJSON(raw) {
  if (!raw) throw new Error("Empty response");
  let s = raw.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```\s*$/, "");
  try {
    return JSON.parse(s);
  } catch (_) {}
  const m = s.match(/\{[\s\S]*\}/);
  if (m) {
    try {
      return JSON.parse(m[0]);
    } catch (_) {}
  }
  throw new Error("Invalid response format. Raw: " + s.slice(0, 200));
}

function calcNutritionGoals(profile) {
  const bw = parseFloat(profile.bodyweight) || (profile.units === "lbs" ? 176 : 80);
  const bwKg = profile.units === "lbs" ? bw * 0.453592 : bw;
  const activity = profile.activityLevel || "moderate";
  const goal = profile.goal || "fitness";
  const heightRaw = parseFloat(profile.height) || 175;
  const heightCm = profile.heightUnit === "in" ? heightRaw * 2.54 : heightRaw;
  const age = parseInt(profile.age) || 30;
  const sex = profile.sex || "male";
  const bmr = sex === "female" ? 10 * bwKg + 6.25 * heightCm - 5 * age - 161 : 10 * bwKg + 6.25 * heightCm - 5 * age + 5;
  const multipliers = {
    sedentary: 1.2,
    light: 1.375,
    moderate: 1.55,
    active: 1.725,
    very_active: 1.9
  };
  const tdee = Math.round(bmr * (multipliers[activity] || 1.55));
  const calMap = {
    fatloss: tdee - 400,
    muscle: tdee + 200,
    strength: tdee + 100,
    fitness: tdee,
    unsure: tdee
  };
  const calories = calMap[goal] || tdee;
  const splits = {
    fatloss: {
      p: 0.35,
      f: 0.30,
      c: 0.35
    },
    muscle: {
      p: 0.30,
      f: 0.25,
      c: 0.45
    },
    strength: {
      p: 0.28,
      f: 0.28,
      c: 0.44
    },
    fitness: {
      p: 0.25,
      f: 0.30,
      c: 0.45
    },
    unsure: {
      p: 0.25,
      f: 0.30,
      c: 0.45
    }
  };
  const s = splits[goal] || splits.fitness;
  return {
    calories,
    protein: Math.round(calories * s.p / 4),
    carbs: Math.round(calories * s.c / 4),
    fat: Math.round(calories * s.f / 9),
    activityLevel: activity
  };
}
